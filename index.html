<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Screen Share</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --panel-2: #222631;
      --border: #2a2f3a;
      --text: #e6e8ee;
      --muted: #8b90a0;
      --accent: #4f8cff;
      --danger: #ff5c5c;
      --ok: #3ecf8e;
      --warn: #f5b041;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      padding: 12px 16px 16px;
      gap: 12px;
    }

    /* ---------- Header ---------- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      font-size: 0.85rem;
    }
    .pill::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    .pill.ok { color: var(--ok); }
    .pill.ok::before { background: var(--ok); }
    .pill.live { color: var(--danger); }
    .pill.live::before { background: var(--danger); animation: pulse 1.5s infinite; }
    .pill.warn { color: var(--warn); }
    .pill.warn::before { background: var(--warn); }
    .pill.err { color: var(--danger); }
    .pill.err::before { background: var(--danger); }
    @keyframes pulse { 50% { opacity: 0.3; } }

    /* ---------- Panels & inputs ---------- */
    .panel {
      background: var(--panel);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-end;
    }
    .field { display: flex; flex-direction: column; gap: 4px; font-size: 0.75rem; color: var(--muted); }
    .spacer { flex: 1; }
    button, select {
      font: inherit;
      font-size: 0.9rem;
      border-radius: 8px;
      border: 0;
      padding: 9px 14px;
      cursor: pointer;
      color: var(--text);
      background: var(--panel-2);
    }
    select { border: 1px solid var(--border); padding: 7px 10px; }
    button.primary { background: var(--accent); color: white; }
    button.danger { background: var(--danger); color: white; }
    button:hover:not(:disabled) { filter: brightness(1.15); }
    button:disabled { opacity: 0.5; cursor: default; }
    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .link-box {
      display: flex;
      gap: 8px;
      flex: 1 1 320px;
      min-width: 0;
    }
    .link-box input {
      flex: 1;
      min-width: 0;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 0.85rem;
    }
    .muted { color: var(--muted); font-size: 0.85rem; }

    /* ---------- Stage (video + controls) ---------- */
    .stage {
      position: relative;
      flex: 1;
      min-height: 220px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stage:fullscreen { border-radius: 0; }
    .stage video {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .stage.has-video video { display: block; }
    .stage.fit-fill video { object-fit: cover; }
    .stage.fit-actual { overflow: auto; align-items: flex-start; justify-content: flex-start; }
    .stage.fit-actual video { width: auto; height: auto; max-width: none; margin: auto; }

    .placeholder {
      color: var(--muted);
      text-align: center;
      padding: 24px;
      max-width: 420px;
      line-height: 1.5;
    }
    .stage.has-video .placeholder { display: none; }

    .controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 28px 12px 12px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.75));
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .stage.has-video.show-controls .controls,
    .stage.has-video .controls:focus-within {
      opacity: 1;
      pointer-events: auto;
    }
    .stage.has-video.idle { cursor: none; }
    .controls button {
      background: rgba(255, 255, 255, 0.12);
      padding: 7px 10px;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .controls button.active { background: var(--accent); }
    .controls svg { width: 18px; height: 18px; fill: currentColor; }
    .controls input[type="range"] { width: 90px; accent-color: var(--accent); }
    .controls .res { color: #ccc; font-size: 0.8rem; margin-left: 4px; white-space: nowrap; }

    .hint {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .hidden { display: none !important; }

    @media (max-width: 600px) {
      .controls .label { display: none; }
      .controls input[type="range"] { width: 60px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Screen Share</h1>
    <span id="status" class="pill">Ready</span>
  </header>

  <!-- Host controls -->
  <section id="hostPanel" class="panel hidden">
    <div id="setupFields" style="display: contents">
      <label class="field">Quality
        <select id="qualitySel">
          <option value="720">720p</option>
          <option value="1080" selected>1080p</option>
          <option value="1440">1440p</option>
          <option value="0">Source</option>
        </select>
      </label>
      <label class="field">Frame rate
        <select id="fpsSel">
          <option value="15">15 fps</option>
          <option value="30" selected>30 fps</option>
          <option value="60">60 fps</option>
        </select>
      </label>
      <label class="field">Optimize for
        <select id="hintSel">
          <option value="detail" selected>Text &amp; detail</option>
          <option value="motion">Motion &amp; video</option>
        </select>
      </label>
      <button id="startBtn" class="primary" style="margin-left: auto">Share my screen</button>
    </div>

    <div id="liveFields" class="hidden" style="display: contents">
      <div class="link-box">
        <input id="linkInput" type="text" readonly aria-label="Share link" />
        <button id="copyBtn" class="primary">Copy link</button>
      </div>
      <span id="viewerCount" class="muted" style="align-self: center">0 viewers</span>
      <div class="spacer"></div>
      <button id="previewBtn" title="Hide the local preview (you keep sharing)"><span class="label">Hide preview</span></button>
      <button id="stopBtn" class="danger">Stop sharing</button>
    </div>
  </section>

  <!-- Video stage -->
  <main id="stage" class="stage fit-contain">
    <div id="placeholder" class="placeholder"></div>
    <video id="video" autoplay playsinline muted></video>

    <button id="unmuteHint" class="hint hidden">🔇 Click to enable sound</button>

    <div class="controls" id="controls">
      <button id="muteBtn" title="Mute (M)" class="hidden">
        <svg viewBox="0 0 24 24"><path id="muteIcon" d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
      </button>
      <input id="volume" type="range" min="0" max="1" step="0.05" value="1" title="Volume (↑/↓)" class="hidden" />
      <span id="resLabel" class="res"></span>
      <div class="spacer"></div>
      <button data-fit="contain" class="active" title="Fit whole screen">Fit</button>
      <button data-fit="fill" title="Fill the window (crops edges)">Fill</button>
      <button data-fit="actual" title="Actual pixels (scrollable)">1:1</button>
      <button id="pipBtn" title="Picture-in-picture (P)">
        <svg viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zm4 8V5c0-1.1-.9-2-2-2H3C1.9 3 1 3.9 1 5v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 0H3V5h18v14z"/></svg>
      </button>
      <button id="fsBtn" title="Fullscreen (F)">
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </div>
  </main>

  <script>
    // Optional: add a TURN server here if viewers on strict networks can't connect.
    // e.g. { urls: "turn:your.turn.server:3478", username: "user", credential: "pass" }
    const ICE_SERVERS = [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
    ];
    const PEER_OPTIONS = { config: { iceServers: ICE_SERVERS } };

    const $ = (id) => document.getElementById(id);
    const video = $("video");
    const stage = $("stage");

    function setStatus(text, kind = "") {
      $("status").textContent = text;
      $("status").className = `pill ${kind}`;
    }

    function showVideo(stream) {
      video.srcObject = stream;
      stage.classList.add("has-video");
      video.play().catch(() => {});
    }

    function hideVideo(message) {
      video.srcObject = null;
      stage.classList.remove("has-video");
      $("placeholder").textContent = message;
      $("resLabel").textContent = "";
    }

    // ---------- Shared player controls ----------
    const ICON_SOUND = "M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z";
    const ICON_MUTED = "M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.45 2.45c.03-.2.05-.42.05-.65zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12a9 9 0 0 0-7-8.8v2.1A7 7 0 0 1 19 12zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a9 9 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z";

    function syncMuteUI() {
      const muted = video.muted || video.volume === 0;
      $("muteIcon").setAttribute("d", muted ? ICON_MUTED : ICON_SOUND);
      $("muteBtn").title = muted ? "Unmute (M)" : "Mute (M)";
      $("volume").value = video.muted ? 0 : video.volume;
      if (!video.muted) $("unmuteHint").classList.add("hidden");
    }

    function toggleMute() {
      video.muted = !video.muted;
      if (!video.muted && video.volume === 0) video.volume = 0.5;
      syncMuteUI();
    }

    function setVolume(v) {
      video.volume = Math.min(1, Math.max(0, v));
      video.muted = video.volume === 0;
      syncMuteUI();
    }

    function setFit(mode) {
      stage.classList.remove("fit-contain", "fit-fill", "fit-actual");
      stage.classList.add(`fit-${mode}`);
      document.querySelectorAll("[data-fit]").forEach((b) =>
        b.classList.toggle("active", b.dataset.fit === mode)
      );
    }

    function toggleFullscreen() {
      if (document.fullscreenElement) document.exitFullscreen();
      else stage.requestFullscreen?.();
    }

    async function togglePip() {
      try {
        if (document.pictureInPictureElement) await document.exitPictureInPicture();
        else await video.requestPictureInPicture();
      } catch {}
    }

    $("muteBtn").onclick = toggleMute;
    $("unmuteHint").onclick = toggleMute;
    $("volume").oninput = (e) => setVolume(parseFloat(e.target.value));
    document.querySelectorAll("[data-fit]").forEach((b) => (b.onclick = () => setFit(b.dataset.fit)));
    $("fsBtn").onclick = toggleFullscreen;
    $("pipBtn").onclick = togglePip;
    if (!document.pictureInPictureEnabled) $("pipBtn").classList.add("hidden");
    video.addEventListener("dblclick", toggleFullscreen);

    video.addEventListener("resize", () => {
      if (video.videoWidth) $("resLabel").textContent = `${video.videoWidth}×${video.videoHeight}`;
    });

    // Auto-hide controls after the mouse stops moving
    let idleTimer;
    function wake() {
      stage.classList.add("show-controls");
      stage.classList.remove("idle");
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        if ($("controls").matches(":hover")) return wake();
        stage.classList.remove("show-controls");
        stage.classList.add("idle");
      }, 2500);
    }
    stage.addEventListener("mousemove", wake);
    stage.addEventListener("touchstart", wake, { passive: true });
    stage.addEventListener("mouseleave", () => {
      clearTimeout(idleTimer);
      stage.classList.remove("show-controls", "idle");
    });

    document.addEventListener("keydown", (e) => {
      if (e.target.matches("input[type=text], select") || !stage.classList.contains("has-video")) return;
      const k = e.key.toLowerCase();
      if (k === "f") toggleFullscreen();
      else if (k === "p") togglePip();
      else if (k === "m" && !$("muteBtn").classList.contains("hidden")) toggleMute();
      else if (e.key === "ArrowUp" && !$("volume").classList.contains("hidden")) { e.preventDefault(); setVolume(video.volume + 0.1); }
      else if (e.key === "ArrowDown" && !$("volume").classList.contains("hidden")) { e.preventDefault(); setVolume(video.volume - 0.1); }
      else return;
      wake();
    });

    // ---------- Route ----------
    const joinId = new URLSearchParams(location.search).get("join");
    if (joinId) startViewer(joinId);
    else startHost();

    // ---------- Host ----------
    function startHost() {
      $("hostPanel").classList.remove("hidden");
      hideVideo("Choose your quality settings, then click “Share my screen”. You'll get a link to send to anyone you want to watch.");

      let peer = null;
      let screenStream = null;
      const viewers = new Map(); // peerId -> { conn, call }

      function showLive(live) {
        $("setupFields").classList.toggle("hidden", live);
        $("liveFields").classList.toggle("hidden", !live);
      }

      function updateViewerCount() {
        const n = viewers.size;
        $("viewerCount").textContent = `${n} viewer${n === 1 ? "" : "s"}`;
      }

      function removeViewer(id) {
        const v = viewers.get(id);
        if (!v) return;
        v.call?.close();
        v.conn?.close();
        viewers.delete(id);
        updateViewerCount();
      }

      function stopSharing() {
        screenStream?.getTracks().forEach((t) => t.stop());
        screenStream = null;
        for (const id of [...viewers.keys()]) removeViewer(id);
        peer?.destroy();
        peer = null;
        showLive(false);
        hideVideo("Sharing stopped. Click “Share my screen” to start again (you'll get a new link).");
        setStatus("Stopped");
        if (document.fullscreenElement) document.exitFullscreen();
      }

      // Hiding the preview avoids the "infinite mirror" when sharing the whole screen
      let previewHidden = false;
      $("previewBtn").onclick = () => {
        previewHidden = !previewHidden;
        if (previewHidden) hideVideo("Preview hidden. You're still sharing.");
        else showVideo(screenStream);
        $("previewBtn").classList.toggle("active", previewHidden);
        $("previewBtn").querySelector(".label").textContent = previewHidden ? "Show preview" : "Hide preview";
      };

      $("startBtn").onclick = async () => {
        const q = parseInt($("qualitySel").value, 10);
        const fps = parseInt($("fpsSel").value, 10);
        const videoConstraints = { frameRate: { ideal: fps, max: fps } };
        if (q) videoConstraints.height = { ideal: q, max: q };

        try {
          screenStream = await navigator.mediaDevices.getDisplayMedia({
            video: videoConstraints,
            audio: true,
          });
        } catch {
          setStatus("Capture cancelled", "warn");
          return;
        }

        const track = screenStream.getVideoTracks()[0];
        track.contentHint = $("hintSel").value;
        // Stop everything if the user ends sharing from the browser's own UI
        track.addEventListener("ended", stopSharing);

        previewHidden = false;
        $("previewBtn").classList.remove("active");
        $("previewBtn").querySelector(".label").textContent = "Hide preview";
        showVideo(screenStream);
        showLive(true);
        $("linkInput").value = "Generating link…";
        updateViewerCount();
        setStatus("Connecting…", "warn");

        peer = new Peer(PEER_OPTIONS);

        peer.on("open", (id) => {
          $("linkInput").value = `${location.origin}${location.pathname}?join=${id}`;
          setStatus("Live", "live");
        });

        // A viewer opens a data connection; we respond by calling them with the screen.
        peer.on("connection", (conn) => {
          conn.on("open", () => {
            const call = peer.call(conn.peer, screenStream);
            viewers.set(conn.peer, { conn, call });
            updateViewerCount();
            call.on("close", () => removeViewer(conn.peer));
            call.on("error", () => removeViewer(conn.peer));
          });
          conn.on("close", () => removeViewer(conn.peer));
        });

        peer.on("disconnected", () => {
          // Lost the signaling server; existing viewers keep working, try to reconnect for new ones.
          if (peer && !peer.destroyed) peer.reconnect();
        });

        peer.on("error", (err) => setStatus(`Error: ${err.type || err.message}`, "err"));
      };

      $("stopBtn").onclick = stopSharing;

      $("copyBtn").onclick = async () => {
        try {
          await navigator.clipboard.writeText($("linkInput").value);
          $("copyBtn").textContent = "Copied!";
        } catch {
          $("linkInput").select();
          $("copyBtn").textContent = "Press Ctrl+C";
        }
        setTimeout(() => ($("copyBtn").textContent = "Copy link"), 1500);
      };
      $("linkInput").onfocus = (e) => e.target.select();
    }

    // ---------- Viewer ----------
    function startViewer(hostId) {
      hideVideo("Connecting to the host…");
      setStatus("Connecting…", "warn");

      let peer = null;

      function ended(message) {
        hideVideo(message);
        $("unmuteHint").classList.add("hidden");
        const retry = document.createElement("div");
        retry.innerHTML = '<br><button class="primary">Try again</button>';
        retry.querySelector("button").onclick = () => { const old = peer; peer = null; old?.destroy(); connect(); };
        $("placeholder").appendChild(retry);
      }

      function connect() {
        hideVideo("Connecting to the host…");
        setStatus("Connecting…", "warn");
        const p = (peer = new Peer(PEER_OPTIONS));
        const current = () => p === peer;

        p.on("open", () => {
          const conn = p.connect(hostId, { reliable: true });
          conn.on("close", () => {
            if (!current()) return;
            setStatus("Ended", "err");
            ended("The host stopped sharing.");
          });
        });

        p.on("call", (call) => {
          call.answer(); // receive only
          call.on("stream", (stream) => {
            if (!current()) return;
            showVideo(stream);
            const hasAudio = stream.getAudioTracks().length > 0;
            $("muteBtn").classList.toggle("hidden", !hasAudio);
            $("volume").classList.toggle("hidden", !hasAudio);
            $("unmuteHint").classList.toggle("hidden", !(hasAudio && video.muted));
            syncMuteUI();
            setStatus("Watching", "ok");
            wake();
          });
          call.on("close", () => {
            if (!current()) return;
            setStatus("Ended", "err");
            ended("The host stopped sharing.");
          });
        });

        p.on("error", (err) => {
          if (!current()) return;
          setStatus("Unavailable", "err");
          if (err.type === "peer-unavailable") ended("This share link isn't active. Ask the host for a new one.");
          else ended(`Connection error: ${err.type || err.message}`);
        });
      }

      connect();
    }
  </script>
</body>
</html>
